# agent-pmo:372ce7f
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dependabot-upgrades
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    target-branch: dependabot-upgrades
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        applies-to: version-updates
        patterns: ["*"]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /Website
    target-branch: dependabot-upgrades
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
