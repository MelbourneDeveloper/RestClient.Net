name: Publish Exhaustion Analyzer to NuGet

on:
  push:
    tags:
      - 'exhaustion-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exhaustion version (e.g., 1.0.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_PROCESSOR_COUNT: '2'

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Isolate NuGet cache
        run: echo "NUGET_PACKAGES=$RUNNER_TEMP/release-nuget" >> "$GITHUB_ENV"

      - name: Resolve and validate release versions
        id: versions
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: python3 scripts/release.py versions --analyzer-version "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Test release ordering and artifact verification
        run: python3 -m unittest discover -s scripts/tests -p test_release_orchestration.py -v

      - name: Build analyzer and local consumer package
        env:
          CLIENT_VERSION: ${{ steps.versions.outputs.client_version }}
          ANALYZER_VERSION: ${{ steps.versions.outputs.analyzer_version }}
        run: python3 scripts/release.py pack --client-version "$CLIENT_VERSION" --analyzer-version "$ANALYZER_VERSION" --output .artifacts/release

      - name: Run analyzer regressions
        env:
          ANALYZER_VERSION: ${{ steps.versions.outputs.analyzer_version }}
        run: dotnet test Exhaustion.Tests/Exhaustion.Tests.csproj --configuration Release --verbosity normal -p:ExhaustionVersion="$ANALYZER_VERSION"

      - name: Verify analyzer through the consumer package
        env:
          CLIENT_VERSION: ${{ steps.versions.outputs.client_version }}
          ANALYZER_VERSION: ${{ steps.versions.outputs.analyzer_version }}
        run: |
          for framework in net8.0 net9.0; do
            python3 scripts/tests/test_release_packages.py --packages .artifacts/release --restclient-version "$CLIENT_VERSION" --exhaustion-version "$ANALYZER_VERSION" --framework "$framework"
          done

      - name: Upload verified analyzer package
        uses: actions/upload-artifact@v4
        with:
          name: exhaustion-nuget-package
          path: .artifacts/release/Exhaustion.*.nupkg
          if-no-files-found: error

      - name: Publish and verify analyzer
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          ANALYZER_VERSION: ${{ steps.versions.outputs.analyzer_version }}
        run: python3 scripts/release.py publish-analyzer --analyzer-version "$ANALYZER_VERSION" --output .artifacts/release
