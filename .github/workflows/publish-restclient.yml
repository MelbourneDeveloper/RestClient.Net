name: Release RestClient.Net and Exhaustion

on:
  push:
    tags:
      - 'restclient-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'RestClient.Net version (e.g., 7.3.1); ExhaustionVersion comes from Directory.Build.props'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_PROCESSOR_COUNT: '2'

    steps:
      - name: Checkout release source
        uses: actions/checkout@v7

      - name: Isolate NuGet cache
        run: echo "NUGET_PACKAGES=$RUNNER_TEMP/release-nuget" >> "$GITHUB_ENV"

      - name: Resolve and validate release versions
        id: versions
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: python3 scripts/release.py versions --client-version "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Test release ordering and artifact verification
        run: python3 -m unittest discover -s scripts/tests -p test_release_orchestration.py -v

      - name: Build both release packages from this commit
        env:
          CLIENT_VERSION: ${{ steps.versions.outputs.client_version }}
          ANALYZER_VERSION: ${{ steps.versions.outputs.analyzer_version }}
        run: python3 scripts/release.py pack --client-version "$CLIENT_VERSION" --analyzer-version "$ANALYZER_VERSION" --output .artifacts/release

      - name: Run analyzer regressions
        run: dotnet test Exhaustion.Tests/Exhaustion.Tests.csproj --configuration Release --verbosity normal

      - name: Verify actual packages in isolated consumers
        env:
          CLIENT_VERSION: ${{ steps.versions.outputs.client_version }}
          ANALYZER_VERSION: ${{ steps.versions.outputs.analyzer_version }}
        run: |
          for framework in net8.0 net9.0; do
            python3 scripts/tests/test_release_packages.py --packages .artifacts/release --restclient-version "$CLIENT_VERSION" --exhaustion-version "$ANALYZER_VERSION" --framework "$framework"
          done

      - name: Upload verified release packages
        uses: actions/upload-artifact@v6
        with:
          name: restclient-and-exhaustion-packages
          path: |
            .artifacts/release/*.nupkg
            .artifacts/release/*.snupkg
          if-no-files-found: error

      - name: Publish and verify Exhaustion before RestClient.Net
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          CLIENT_VERSION: ${{ steps.versions.outputs.client_version }}
          ANALYZER_VERSION: ${{ steps.versions.outputs.analyzer_version }}
        run: python3 scripts/release.py publish --client-version "$CLIENT_VERSION" --analyzer-version "$ANALYZER_VERSION" --output .artifacts/release

      - name: Verify published packages from NuGet in fresh consumers
        env:
          CLIENT_VERSION: ${{ steps.versions.outputs.client_version }}
          ANALYZER_VERSION: ${{ steps.versions.outputs.analyzer_version }}
        run: |
          for framework in net8.0 net9.0; do
            python3 scripts/tests/test_release_packages.py --public-nuget --restclient-version "$CLIENT_VERSION" --exhaustion-version "$ANALYZER_VERSION" --framework "$framework"
          done
